<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Smolov Tracker</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">🏋️ Smolov</div>
    <nav class="tabs">
      <button class="tab-btn" data-view="next">Next</button>
      <button class="tab-btn" data-view="overview">Overview</button>
      <button class="tab-btn" data-view="progress">Progress</button>
      <button class="tab-btn" data-view="settings">Settings</button>
    </nav>
  </header>

  <main id="app" class="app"></main>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
